<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
   <Fieldset>
    <legend>Biodata</legend>

        <form action="./Response.html">

    <lable for="name">Name:</lable>
    <input type="text" name="name" id="name" id="name"
    placeholder="Enter your name" required>

    <br><br>

    <lable for="email">Email:</lable>
    <input type="email" name="email" id="email"
    placeholder="Enter your email" required>

    <br><br>

    <lable for="password">Password:</lable>
    <input type="password" name="password" id="password">

    <br><br>

     <lable for="gen">Gender:</lable>
    <input type="radio" name="gen" id="gen">
    <lable for="male">Male</lable>
    <input type="radio" name="male" id="male">
     <lable for="female">Female</lable>
     <input type="radio" name="female" id="female">
     <lable for="others">Others</lable>

<br><br>

<lable for="hobb">Hobbies:</lable>
<input type="checkbox" name="check1" id="check1">
<lable for="crick">cricket</lable>
<input type="checkbox" name="check2" id="check2">
<lable for="carm">carrom</lable>
<br><br>

<select name="lang" id="lang">
    <option value="C">C</option>
    <option value="C++">C++</option>
    <option value="Python">Python</option>
</select>
<br><br>

<lable for="dob">Date of Birth:</lable>
<input type="date" name="dob" id="dob">
<br><br>

<lable for="attempt">Attempt:</lable>
<input type="number" name="attempt" id="attempt">
<br><br>

<lable for="url">Enter your Homepage:</lable>
<input type="url" name="url" id="url">
<br><br>

<lable for="file">Upload your resume:</lable>
<input type="file" name="file" id="file">
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">




     
   </Fieldset>
   </form>
</body>
</html>
