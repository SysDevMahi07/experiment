<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <h1 align="center">Student Registration Form</h1>
        <hr>

        <lable for="name">Name:</lable>
    <input type="text" name="name" id="name" id="name"
    placeholder="Emter your name" required>
<br><br>

 <lable for="email">Email:</lable>
      <input type="email" name="email" id="email"
       placeholder="Enter your email" required>
<br><br>

<lable for="password">Password:</lable>
    <input type="password" name="password" id="password"
    placeholder="Enter the password" required>
    <br><br>

     <lable for="gen">Gender:</lable>
    <input type="radio" name="gen" id="gen">
    <lable for="male">Male</lable>
    <input type="radio" name="male" id="male">
    <lable for="female">Female</lable>
    <input type="radio" name="female" id="female">
    <lable for="others">Others</lable> 
    <br><br>

    <label for="course">course:</label>
    <select name="course" id="course">
        <option value="single">B.Tech</option>
        <option value="double">M.Tech</option>
        <option value="suite">BCA</option>
        <option value="suite">MCA</option>
        <option value="suite">BBA</option>
        <option value="suite">MBA</option>
    </select>
    <br><br>

    <lable for="Phone">Phone:</lable>
    <input type="number" name="Phone" id="Phone"
    placeholder="Enter your phone number" required>
    <br><br>

    <lable for ="Adress">Address:</lable>
    <textarea name="Adress" id="Adress" ></textarea>
    <br><br>

     <input type="submit" value="Register">
    <input type="reset" value="Clear">
    
    </fieldset>
</body>
</html>
