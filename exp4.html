<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset align="center">
        <h1 align="center">Hotel Room Booking Form</h1> 
        <lable for="Full name">Full Name:</lable>
    <input type="text" name="name" id="name" id="name"
    placeholder="Emter your name" required>
    <br><br> 

    <lable for="email">Email:</lable>
      <input type="email" name="email" id="email"
       placeholder="Enter your email" required>

    <br><br>
    
    <lable for="Phone">Phone:</lable>
    <input type="number" name="Phone" id="Phone"
    placeholder="Enter your phone number" required>
    <br><br>
 
    <lable for="date">Check-in Date:</lable>
    <input type="date" name="date" id="date">
    <br><br>

    <lable for="date">Check-out Date:</lable>
    <input type="date" name="date" id="date">
    <br><br>
 
    <label for="room">Room Type:</label>
    <select name="room" id="room">
        <option value="single">Single</option>
        <option value="double">Double</option>
        <option value="suite">Suite</option>
    </select>
    <br><br>

    <lable for="number">Number of Guests:</lable>
    <input type="number" name="number" id="number"
    placeholder="Enter number of guests" required>
    <br><br>

    <lable for="requests">Special Requests:</lable>
    <textarea name="requests" id="requests" ></textarea>
    <br><br>

    <input type="submit" value="Book Now">
    <input type="reset" value="Reset">
    <br><br>

      </fieldset>
</body>
</html>
